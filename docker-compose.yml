version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./interviewer.db
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
      - ./knowledge_base:/app/knowledge_base

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
